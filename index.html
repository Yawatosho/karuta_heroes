<body data-mode="cpu">
  <main id="main" class="arena">
    <div class="ambient-lines" aria-hidden="true"></div>
    <div class="scan-grid" aria-hidden="true"></div>
    <div id="fxLayer" aria-hidden="true"></div>

    <section class="game-shell" aria-label="スーパー日本十進分類カルタ">
      <header class="game-hero">
        <img class="game-logo" src="reference/ロゴ案.png" alt="NDC Karuta Heroes">
        <div class="fighter-brand" aria-label="NDC Karuta Heroes">
          <span>NDC KARUTA</span>
          <strong>HEROES</strong>
        </div>
      </header>

      <div id="karuta">
        <div id="cpuCursor" class="cpu-cursor" aria-hidden="true"></div>

        <p class="action-row">
          <button id="startButton" type="button" aria-label="STORY MODE">STORY MODE</button>
          <button id="twoPlayerButton" type="button" aria-label="2P BATTLE">2P BATTLE</button>
          <button id="galleryButton" type="button" aria-label="GALLERY">GALLERY</button>
          <button id="howToButton" type="button" aria-label="HOW TO PLAY">HOW TO PLAY</button>
          <button id="patchNoteButton" type="button" aria-label="PATCH NOTE">PATCH NOTE</button>
          <button id="quitButton" type="button">QUIT</button>
          <button id="restartButton" type="button">RETRY</button>
        </p>

        <section id="optionPanel" class="option-panel" aria-label="OPTION">
          <p class="option-title">OPTION</p>
          <fieldset class="voice-options">
            <legend>VOICE</legend>
            <label class="voice-choice">
              <input type="radio" name="voiceVariant" value="a" checked>
              <span>VOICE A</span>
            </label>
            <label class="voice-choice">
              <input type="radio" name="voiceVariant" value="b">
              <span>VOICE B</span>
            </label>
          </fieldset>
        </section>

        <section class="cpu-level-panel" aria-label="CPU難易度">
          <label for="cpuLevel">CPU LEVEL</label>
          <select id="cpuLevel">
            <option value="beginner">風の目録使い / Beginner</option>
            <option selected value="normal">分類の魔術師 / Normal</option>
            <option value="expert">デジタルライブラリアン / Expert</option>
            <option value="god">至高の司書 / God</option>
          </select>
        </section>

        <section class="reader-panel is-hidden" aria-label="読み札">
          <div id="countdownDisplay" class="countdown-display" aria-live="polite"></div>
          <div id="reading">
            <div id="digit1" class="digit"><div class="num">&nbsp;</div></div>
            <div id="digit2" class="digit"><div class="num">&nbsp;</div></div>
            <div id="digit3" class="digit"><div class="num">&nbsp;</div></div>
          </div>
          <div class="hud">
            <div id="waveDisplay">WAVE: 1</div>
            <div id="lifeDisplay">LIFE: 3</div>
            <div id="scoreDisplay">SCORE: 0pt</div>
            <div id="scoreDisplayPlayer">YOU: 0pt</div>
            <div id="scoreDisplayCPU">CPU: 0pt</div>
            <div id="comboDisplay"></div>
            <div id="timeDisplay">TIME: 15.0 sec</div>
          </div>
        </section>

        <div id="cardGrid" class="grid" style="display: none;"></div>
        <div id="message"></div>

        <audio id="correctSound" preload="auto" playsinline>
          <source src="sound/correct.mp3" type="audio/mpeg">
        </audio>
        <audio id="characterSound" preload="auto" playsinline>
          <source src="sound/character.mp3" type="audio/mpeg">
        </audio>
        <audio id="ngSound" preload="auto" playsinline>
          <source src="sound/ng.mp3" type="audio/mpeg">
        </audio>
        <audio id="startSound" preload="auto" playsinline>
          <source src="sound/start.mp3" type="audio/mpeg">
        </audio>
        <audio id="roundCallSound" preload="auto" playsinline>
          <source src="sound/roundcall.mp3" type="audio/mpeg">
        </audio>
        <audio id="koSound" preload="auto" playsinline>
          <source src="sound/KO.mp3" type="audio/mpeg">
        </audio>
        <audio id="timeUpSound" preload="auto" playsinline>
          <source src="sound/timeup.mp3" type="audio/mpeg">
        </audio>
        <audio id="perfectSound" preload="auto" playsinline>
          <source src="sound/perfect.mp3" type="audio/mpeg">
        </audio>
        <audio id="winLibSound" preload="auto" playsinline>
          <source src="sound/win_lib.mp3" type="audio/mpeg">
        </audio>
        <audio id="winDetSound" preload="auto" playsinline>
          <source src="sound/win_det.mp3" type="audio/mpeg">
        </audio>
        <audio id="winLilySound" preload="auto" playsinline>
          <source src="sound/win_lily.mp3" type="audio/mpeg">
        </audio>
        <audio id="winProfSound" preload="auto" playsinline>
          <source src="sound/win_prof.mp3" type="audio/mpeg">
        </audio>
        <audio id="winEnemySound" preload="auto" playsinline>
          <source src="sound/win_enemy.mp3" type="audio/mpeg">
        </audio>
        <audio id="victorySound" preload="auto" playsinline>
          <source src="sound/victory.mp3" type="audio/mpeg">
        </audio>
        <audio id="resultSound" preload="auto" playsinline>
          <source src="sound/result.mp3" type="audio/mpeg">
        </audio>
      </div>
    </section>

    <dialog id="howToModal" class="game-modal">
      <div class="modal-frame">
        <div class="modal-head">
          <h2>HOW TO PLAY</h2>
          <button class="modal-close" type="button" data-close-modal="howToModal" aria-label="閉じる">×</button>
        </div>
        <div class="rules-grid">
          <section>
            <h3 id="ruleTitle1">1. ファイターを選ぶ</h3>
            <p id="ruleText1">4人の英雄から一人を選び、知識の闘技場へ挑みます。</p>
          </section>
          <section>
            <h3 id="ruleTitle2">2. 分類札をつかむ</h3>
            <p id="ruleText2">3桁のNDCを読み解き、相手より早く対応する分類札を取ります。</p>
          </section>
          <section>
            <h3 id="ruleTitle3">3. 栄冠をつかむ</h3>
            <p id="ruleText3">SPECIALを駆使し、10TURNで構成されるROUNDを2本先取すれば勝利です。</p>
          </section>
        </div>
      </div>
    </dialog>

    <dialog id="resultModal" class="game-modal result-modal">
      <div class="modal-frame">
        <div class="modal-head">
          <h2>RESULT</h2>
          <button class="modal-close" type="button" data-close-modal="resultModal" aria-label="閉じる">×</button>
        </div>
        <div id="resultDisplay">
          <div id="battleResult"></div>
          <div id="resultCards"></div>
        </div>
        <div class="result-actions">
          <button id="resultTopButton" type="button" data-close-modal="resultModal">TOP</button>
        </div>
      </div>
    </dialog>

    <footer class="credits">
      <p>NDC9：日本図書館協会 / 作成：やわらか図書館学</p>
    </footer>
  </main>
